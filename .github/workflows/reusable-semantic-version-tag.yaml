name: Reusable Semantic Version Tag

on:
  workflow_call:
    inputs:
      version-level:
        description: "Version bump type (major, minor, patch, alpha, beta, rc, dev, etc.)"
        required: false
        default: ""
        type: string
      specific-version:
        description: "Explicit version to tag (e.g., 1.2.3). If provided, bump is skipped."
        required: false
        default: ""
        type: string
      tag-prefix:
        description: "Prefix for tags (like 'v')"
        required: false
        default: "v"
        type: string
      current-version:
        description: "Current version to base bump from (optional)"
        required: false
        default: ""
        type: string
    outputs:
      new_tag:
        description: "The new semantic version tag created"
        value: ${{ jobs.create-tag.outputs.tag }}
    secrets:
      token:
        description: "GitHub token for tag push"
        required: false

jobs:
  create-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.semver.outputs.new_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        env:
          GITHUB_TOKEN: ${{ secrets.token || github.token }}

      # The upstream action uses `git describe`, which picks the nearest
      # reachable tag rather than the highest version in the repository.
      # In a merged PR this can select an existing tag (e.g. v0.0.65).
      - name: Detect latest existing stable version
        id: latest_version
        shell: bash
        env:
          TAG_PREFIX: ${{ inputs['tag-prefix'] }}
          CURRENT_VERSION: ${{ inputs['current-version'] }}
          SPECIFIC_VERSION: ${{ inputs['specific-version'] }}
        run: |
          if [[ -n "$SPECIFIC_VERSION" || -n "$CURRENT_VERSION" ]]; then
            echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only stable numeric SemVer tags are used as the bump baseline.
          # Any prerelease tags remain separate; all tags were fetched by checkout.
          latest=$(git tag --list | grep -E '^v?[0-9]+\\.[0-9]+\\.[0-9]+        id: semver
        uses: anantakumarghosh/semver-tag-action@v2.0.0
        with:
          version-level: ${{ inputs['version-level'] }}
          specific-version: ${{ inputs['specific-version'] }}
          current-version: ${{ steps.latest_version.outputs.version }}
          tag-prefix: ${{ inputs['tag-prefix'] }}
        env:
          GITHUB_TOKEN: ${{ secrets.token || github.token }}

      - name: Tag Summary
        run: |
          echo "✅ Created tag" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 semver-tag-action Details" >> $GITHUB_STEP_SUMMARY
          echo "Using [anantakumarghosh/semver-tag-action](https://github.com/anantakumarghosh/semver-tag-action/tree/main)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See the [README](https://github.com/anantakumarghosh/semver-tag-action/blob/main/README.md) for more details." >> $GITHUB_STEP_SUMMARY | sort -V | tail -n 1 || true)
          if [[ -z "$latest" ]]; then
            latest="${TAG_PREFIX}0.0.0"
          fi
          echo "Latest stable tag: $latest"
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Generate or use specific version tag
        id: semver
        uses: anantakumarghosh/semver-tag-action@v2.0.0
        with:
          version-level: ${{ inputs['version-level'] }}
          specific-version: ${{ inputs['specific-version'] }}
          current-version: ${{ inputs['current-version'] }}
          tag-prefix: ${{ inputs['tag-prefix'] }}
        env:
          GITHUB_TOKEN: ${{ secrets.token || github.token }}

      - name: Tag Summary
        run: |
          echo "✅ Created tag" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 semver-tag-action Details" >> $GITHUB_STEP_SUMMARY
          echo "Using [anantakumarghosh/semver-tag-action](https://github.com/anantakumarghosh/semver-tag-action/tree/main)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See the [README](https://github.com/anantakumarghosh/semver-tag-action/blob/main/README.md) for more details." >> $GITHUB_STEP_SUMMARY